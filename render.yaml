services:
  - type: web
    name: ecorecicla
    env: node
    plan: free
    buildCommand: cd src/frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd src/backend && npm start
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGIN
        value: "*"